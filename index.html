<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eco-Cyclo — Reciclagem que vira recompensa</title>
<meta name="description" content="Recicle materiais, ganhe pontos e troque por cupons em lojas parceiras. Cofinanciamento entre Eco-Cyclo e comércio local." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="#/" class="brand">
        <span class="brand-mark">♻</span>
        <span>Eco-Cyclo</span>
      </a>
      <nav id="menu" class="menu">
        <a href="#/" data-link>Início</a>
        <a href="#/sobre" data-link>Sobre</a>
        <a href="#/parcerias" data-link>Parcerias</a>
        <a href="#/locais" data-link>Locais</a>
      </nav>
      <button id="burger" class="burger" aria-label="Abrir menu">☰</button>
    </div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <div class="container footer-inner">
      <div>
        <div class="brand"><span class="brand-mark">♻</span><span>Eco-Cyclo</span></div>

      <div class="qr-box">
        <img src="qrcode.png" alt="QR code para acessar o site da Eco-Cyclo" />
        <div class="qr-text">
          <h4>Aponte a câmera</h4>
          <p class="muted">Acesse o site pelo celular</p>
        </div>
      </div>
      <div class="small muted">© <span id="year"></span> Eco-Cyclo — Todos os direitos reservados.</div>
    </div>
  </footer>

  <script src="script.js"></script>
